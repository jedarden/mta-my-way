agent:
  default: glm
  timeout: 600

gates:
  - type: command
    run_in: clean
    commands:
      - scripts/definition-of-done.sh --fast

strands:
  pluck:
    enabled: true
    exclude_labels:
    - deferred
    - human
    - blocked
  explore:
    enabled: true
    workspaces:
    - /home/coding/AgentScribe
    - /home/coding/ai-code-battle
    - /home/coding/spaxel
    - /home/coding/domain-check
  weave:
    enabled: true
    max_beads_per_run: 3
    cooldown_hours: 24
    doc_patterns:
    - README*
    - docs/**/*
  unravel:
    enabled: true
    max_beads_per_run: 3
    cooldown_hours: 168
  pulse:
    enabled: true
    cooldown_hours: 48
    severity_threshold: 3
    scanners:
    - name: lint
      command: npm run lint 2>&1
    - name: test
      command: npm test 2>&1
prompt:
  context_files: []
  instructions: 'You are working on MTA My Way, a mobile-first PWA for NYC subway
    commuters.

    The project is a TypeScript monorepo (packages/server, packages/web, packages/shared).

    Backend is Hono on Node.js; frontend is React + Vite.

    Follow existing code patterns. Run `npm test` and `npm run lint` before closing
    a bead. The dispatch gate uses `scripts/definition-of-done.sh --fast` to verify
    committed state.

    '
bead_cli:
  backend: bead-rs
