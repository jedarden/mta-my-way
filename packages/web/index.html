<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0039A6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Mobile-first PWA for NYC subway commuters - real-time arrivals, transfer intelligence, and filtered alerts" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MTA My Way" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>MTA My Way</title>
    <!--
      Resource-hint policy (2026-09-13, mtamyway-f2a65cf7): no preconnects, no
      prefetches, no modulepreloads — not even ones Vite would emit for a
      static entry script. Under LHCI simulated throttling, Lantern charges
      FCP with every request *initiated* before the observed first paint (a
      preload link starts fetching at parse time, ~20ms before the shell's
      first painted frame), so parse-time preloads of the app chunk graph put
      ~130KB of fetch + 4x-CPU evaluation back on the FCP critical chain even
      though the shell paints without them. The graph is instead fetched when
      the boot script below starts the dynamic import — strictly after the
      first paint — which drops it onto the LCP chain, where it belongs.
      Every hint that used to live here was also dead weight on its own
      terms:
      - `modulepreload /src/main.tsx` was rewritten by Vite into a data: URI
        embedding main.tsx's entire source (~1.4KB of base64 in every response)
      - `modulepreload /src/App.tsx` pointed at /assets/App-*.tsx, which does
        not exist in the build (404)
      - prefetches for /api/stations|routes|health hit the preview/deploy proxy
        and 502 during measurement; they also never warmed the app's real
        requests (apiEnhanced adds query strings and auth headers)
      - preconnects to cdn.jsdelivr.net and api.mta.info: nothing in the app
        ever connects to either origin from the browser
      The stylesheet is inlined into this document at build time (see
      inlineCriticalCss in vite.config.ts), so the document itself carries
      everything needed for the first paint.
    -->
  </head>
  <body class="bg-background text-text-primary">
    <!--
      Static app shell (mtamyway-f2a65cf7). FCP used to wait for the whole JS
      graph because #root was empty and nothing contentful existed until React
      rendered. The shell below is painted straight from the document at HTML
      parse time; createRoot().render() clears #root's existing children on
      first render, so React replaces it wholesale with the real app. The
      markup and class names mirror Screen/Header/Skeleton deliberately: same
      header geometry means the swap causes no visible jump at the top of the
      viewport. The placeholder rows are aria-hidden — they carry no meaning;
      the h1 is left in the tree so a pre-JS screen-reader user still gets the
      app title.
    -->
    <div id="root">
      <div class="flex flex-col h-full bg-background dark:bg-dark-background">
        <header
          class="sticky top-0 z-50 bg-background dark:bg-dark-background border-b border-surface dark:border-dark-surface px-4 py-3 pt-[env(safe-area-inset-top)]"
          role="banner"
        >
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <h1 class="text-xl font-bold text-text-primary dark:text-dark-text-primary">
                MTA My Way
              </h1>
            </div>
          </div>
        </header>
        <main class="flex-1 overflow-y-auto px-4 py-3" aria-hidden="true">
          <div class="rounded bg-surface dark:bg-dark-surface h-5 w-36 mb-3"></div>
          <div class="rounded border border-surface dark:border-dark-surface p-3 mb-3">
            <div class="rounded bg-surface dark:bg-dark-surface h-6 w-48 mb-2"></div>
            <div class="rounded bg-surface dark:bg-dark-surface h-4 w-full mb-1.5"></div>
            <div class="rounded bg-surface dark:bg-dark-surface h-4 w-4/5 mb-1.5"></div>
            <div class="rounded bg-surface dark:bg-dark-surface h-4 w-3/5"></div>
          </div>
          <div class="rounded border border-surface dark:border-dark-surface p-3 mb-3">
            <div class="rounded bg-surface dark:bg-dark-surface h-6 w-56 mb-2"></div>
            <div class="rounded bg-surface dark:bg-dark-surface h-4 w-full mb-1.5"></div>
            <div class="rounded bg-surface dark:bg-dark-surface h-4 w-2/3"></div>
          </div>
        </main>
      </div>
    </div>
    <!--
      Agentation visual-feedback toolbar (workspace agentation rule). The
      import map MUST precede the first module script: /agentation.js
      imports bare `react` specifiers, which only resolve through a map the
      browser has already processed — a map that follows (or is omitted
      next to) the module dies with "Failed to resolve module specifier"
      while the page renders perfectly. Inline and fetch-free, so it adds
      nothing to the parse-time critical chain the resource-hint policy
      above protects. The version pins are deliberate, matching the pinned
      entries in public/agentation.js.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime"
        }
      }
    </script>
    <script type="module">
      // Boot the app only after the static shell above has painted
      // (mtamyway-f2a65cf7). A module script evaluates as soon as it is
      // ready, and on an unthrottled connection that evaluation wins the
      // race against the first paint — so the whole JS graph would be
      // charged to first-contentful-paint even though the shell is already
      // parsed and stylable. The gate is rAF + setTimeout(0), not two rAFs:
      // a rAF callback runs *before* its frame's paint, so a double-rAF boot
      // still evaluates the dynamic import ahead of the second painted
      // frame, and requests initiated before the observed FCP event land on
      // FCP's critical chain under LHCI simulated throttling. rAF schedules
      // the timer before frame 1 paints; the timer task then runs after that
      // paint is out, making the first painted frame strictly precede the
      // app graph's fetches. rAF is paused while the tab is hidden and runs
      // on reveal, so a background-tab load still boots when it is viewed.
      // The resolved promise is published for the Agentation loader below,
      // which must not fetch during the app graph's boot window (measured:
      // same-gate toolbar fetches compete with the app chunks for bandwidth
      // under simulated throttling and pushed app-content LCP past the 2.5s
      // budget — 3.4s vs 2.1s with the toolbar chained after the graph).
      let booted = false;
      const boot = () => {
        if (booted) return;
        booted = true;
        window.__appGraphReady = import("/src/main.tsx").catch(() => {});
      };
      requestAnimationFrame(() => setTimeout(boot, 0));
    </script>
    <!--
      Agentation toolbar (workspace agentation rule), loaded from the same
      post-paint gate as the app graph: a parse-time <script type="module"
      src="/agentation.js"> would start the /agentation.js fetch and the
      esm.sh React fetches it triggers before the first painted frame, and
      Lantern charges every request initiated before first paint to FCP —
      exactly what the app-graph gating above exists to avoid. This loader
      is a classic (non-module) script on purpose: the bundler leaves
      classic inline scripts untouched, so import() fires at runtime with
      the literal URL, and dynamic import from a classic script still
      resolves through the import map above.

      The import itself waits for the app graph to resolve
      (window.__appGraphReady), and then for the app's fetch cascade (lazy
      route chunks, initial API calls) to go quiet: the initial screen is a
      lazy() chunk whose fetch begins only after main.tsx executes, so a
      toolbar import chained at main.tsx-resolution time still shares the
      boot window with it — measured LCP 3.4s vs 2.1s under LHCI simulated
      throttling. Waiting for 600ms of resource-timing silence (capped at
      4s) puts the toolbar's esm.sh fetches strictly after the app's boot
      fetches in the observed waterfall. The feedback toolbar is the
      lowest-priority script on the page; it loads last by construction.
      This script's rAF is registered after the boot script's, so by the
      time its timer fires, __appGraphReady already exists.
    -->
    <script>
      (function () {
        var loadToolbar = function () {
          (window.__appGraphReady || Promise.resolve())
            .then(function () {
              // Resolve once the app's own fetch cascade has gone quiet
              // (600ms with no new resource entries), or after 4s hard cap.
              return new Promise(function (resolve) {
                var started = performance.now();
                var last = performance.getEntriesByType("resource").length;
                var quietMs = 0;
                var tick = setInterval(function () {
                  var n = performance.getEntriesByType("resource").length;
                  quietMs = n === last ? quietMs + 300 : 0;
                  last = n;
                  if (quietMs >= 600 || performance.now() - started > 4000) {
                    clearInterval(tick);
                    resolve();
                  }
                }, 300);
              });
            })
            .then(function () {
              return import("/agentation.js");
            })
            .catch(function () {
              // mount failure is reported by the self-check below
            });
        };
        requestAnimationFrame(function () {
          setTimeout(loadToolbar, 0);
        });
        // Agentation must mount; the module dies silently if its import
        // map is broken or esm.sh is unreachable. Poll rather than check
        // once: the toolbar now loads only after the app graph resolves,
        // which on a slow link is seconds after the load event.
        window.addEventListener("load", function () {
          var attempts = 0;
          var check = setInterval(function () {
            attempts += 1;
            if (document.getElementById("agentation-root")) {
              clearInterval(check);
              console.log("✓ Agentation mounted successfully");
            } else if (attempts >= 20) {
              clearInterval(check);
              console.warn(
                "Agentation did not mount; check the import map and /agentation.js module"
              );
            }
          }, 1000);
        });
      })();
    </script>
  </body>
</html>
